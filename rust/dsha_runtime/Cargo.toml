[package]
name = "dsha_runtime"
version = "0.1.0"
edition = "2024"

# 版权来源：DSHA（MIT）——各派生文件带归因头，汇总见 my_app THIRD_PARTY_NOTICES.md。
# 纯逻辑支撑层零依赖；归档解包层（下一轮）引入现成 tar/flate2 crate。
[dependencies]
flate2 = "1"
unicode-normalization = "0.1"
# fd 钉定设备文件层（AndroidDeviceFiles 移植）：POSIX openat/lstat/linkat 族
rustix = { version = "1", features = ["fs", "std"] }
# 语义树证明（VirtualScreenAnchorProof 移植）：SHA-256 摘要
sha2 = "0.10"
