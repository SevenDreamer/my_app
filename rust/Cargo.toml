[package]
name = "my_app"
version = "0.1.0"
edition = "2021"
description = "My App - Rust Core"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
flutter_rust_bridge = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
anyhow = "1"
thiserror = "2"

# 数据库
sqlx = { version = "0.8", features = [
  "runtime-tokio-rustls",  # 使用 tokio + rustls（原生 TLS）
  "sqlite",                   # SQLite
  "mysql",                   # MySQL
  "postgres",                # PostgreSQL
] }
mongodb = { version = "3" }  # tokio runtime 是默认内置的
uuid = { version = "1", features = ["v4", "serde"] }
urlencoding = "2"
once_cell = "1"
bcrypt = "0.15"

[profile.release]
lto = true
codegen-units = 1
