[package]
name = "hermes_agent"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
# Flutter-Rust 桥接
flutter_rust_bridge = "2"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 日志
log = "0.4"
env_logger = "0.11"

# LLM 客户端（Phase 1）
reqwest = { version = "0.12", features = ["json"] }

# 错误处理
anyhow = "1"
thiserror = "2"

[build-dependencies]
flutter_rust_bridge_codegen = "2"
