# ⚠️ 临时 workflow：导出 Android 签名物料（keystore + key.properties）为 artifact。
# 用途：本机缺 keystore 时取回，保持发版签名一致。
# 用完即删（不要长期保留——它能接触签名私钥）。
# 安全：只上传 artifact，不把任何 secret 内容打进日志。
name: temp · keystore export

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: 恢复签名物料（不打印内容）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::secrets 缺失（ANDROID_KEYSTORE_B64 / ANDROID_KEY_ALIAS / ANDROID_KEYSTORE_PASSWORD）"
            exit 1
          fi
          mkdir -p out
          printf '%s' "$KEYSTORE_B64" | base64 -d > out/my_app-release.jks
          printf 'keyAlias=%s\nkeyPassword=%s\nstoreFile=my_app-release.jks\nstorePassword=%s\n' \
            "$KEY_ALIAS" "$KEY_PASSWORD" "$KEY_PASSWORD" > out/key.properties
          # 只输出文件大小做健全性检查，绝不输出内容
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: keystore
          path: out/
          retention-days: 1
