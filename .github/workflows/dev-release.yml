# 开发版自动发布：构建 Android apk 并创建 GitHub Pre-release
#
# 用法：Actions 页手动 Run（workflow_dispatch）；
# 想要「每次 commit 自动推」就取消下面 push 触发的注释。
# 版本号 = 1.3.0-dev.<构建序号>+100（跳过手动发过的 dev.1~99，永不撞号）。
name: CD · 开发版发布

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: write   # 创建 Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true   # 缓存 Flutter SDK 与 pub 依赖

      - name: 缓存 Android SDK 与 Gradle
        uses: actions/cache@v4
        with:
          save-always: true   # job 失败也存（构建中间产物同样有价值）
          path: |
            ${{ env.ANDROID_HOME }}/build-tools
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/cmake
            ${{ env.ANDROID_HOME }}/ndk
            ~/.gradle/caches
            ~/.gradle/wrapper
          # 固定 key（手工 bump）：SDK 内容极少变；hash 任何配置文件都会
          # 造成"一改配置就砸缓存"的恶性循环（PITFALLS #19）
          key: ${{ runner.os }}-android-sdk-cache-v1
          restore-keys: |
            ${{ runner.os }}-android-sdk-cache-

      - run: flutter pub get

      # 用 Secrets 恢复签名（与本地 release 同一把钥匙，覆盖安装不冲突）
      - name: 恢复签名配置
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/my_app-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=my_app-release.jks\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" \
              > android/key.properties
            echo "signing restored"
          else
            echo "no signing secrets -- debug fallback"
          fi

      - name: 计算 dev 版本号
        id: ver
        run: |
          N=$(( ${{ github.run_number }} + 100 ))
          echo "name=1.3.0-dev.$N" >> "$GITHUB_OUTPUT"
          echo "number=$N" >> "$GITHUB_OUTPUT"

      # path_provider_android 用 jni（CMake native 构建）；AGP 自动下载已禁，
      # 这里显式安装 CMake（版本与 AGP 要求一致），由上方缓存负责存取
      - name: 安装 CMake（path_provider 的 jni 构建需要）
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" > /dev/null

      - name: 构建 apk（分架构 + 版本参数化，不改 pubspec）
        run: >
          flutter build apk --release --split-per-abi
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ steps.ver.outputs.number }}

      - name: 创建 Pre-release（资产名带版本号+架构）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
               "build/my_app-v${{ steps.ver.outputs.name }}-android-${abi}.apk"
          done
          gh release create "v${{ steps.ver.outputs.name }}" \
            build/my_app-v${{ steps.ver.outputs.name }}-android-arm64-v8a.apk \
            build/my_app-v${{ steps.ver.outputs.name }}-android-armeabi-v7a.apk \
            build/my_app-v${{ steps.ver.outputs.name }}-android-x86_64.apk \
            --prerelease \
            --title "v${{ steps.ver.outputs.name }}" \
            --notes "开发版自动构建（commit ${GITHUB_SHA::7}）"
