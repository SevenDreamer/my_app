name: CD · 开发版发布

on:
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release

jobs:
  # ─────────── 节点 1：编译前准备（版本号计算，下游共用） ───────────
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.ver.outputs.name }}
      # bare = 去掉 v 前缀的版本号（--build-name 用，APK 版本显示才规范）
      bare: ${{ steps.ver.outputs.bare }}
      number: ${{ steps.ver.outputs.number }}
    steps:
      - uses: actions/checkout@v5

      - name: 读取版本号（pubspec 是唯一版本来源）
        id: ver
        run: |
          # 版本号统一由 pubspec.yaml 维护（version: 1.3.0-dev.3+6）
          # Release tag = v{版本名}（不含 +build 号）——同号重发覆盖更新
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          NAME="v${VER%%+*}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "bare=${VER%%+*}" >> "$GITHUB_OUTPUT"
          echo "number=${VER##*+}" >> "$GITHUB_OUTPUT"
          echo "本次版本：$NAME（build ${VER##*+}，来源 pubspec）"

  # ─────────── 节点 2：Android 构建 ───────────
  # NDK 实验结论（PITFALLS #20）：:jni 模块钉死 Flutter 默认 28.2，
  # 换 30.0（镜像预装）直接构建失败——28.2 是硬需求，显式安装+缓存兜底
  build-android:
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 缓存 Android SDK 与 Gradle
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.ANDROID_HOME }}/build-tools
            ${{ env.ANDROID_HOME }}/platforms
            ~/.gradle/caches
            ~/.gradle/wrapper
          # 固定 key（手工 bump）：SDK 内容极少变；hash 配置文件会造成
          # "一改配置就砸缓存"的恶性循环（PITFALLS #19）
          key: ${{ runner.os }}-android-sdk-cache-v1
          restore-keys: |
            ${{ runner.os }}-android-sdk-cache-

      - name: 恢复签名配置（从三个 secret 构造 key.properties）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/my_app-release.jks
            printf 'keyAlias=%s\nkeyPassword=%s\nstoreFile=my_app-release.jks\nstorePassword=%s\n' \
              "$KEY_ALIAS" "$KEY_PASSWORD" "$KEY_PASSWORD" > android/key.properties
            echo "签名配置已恢复"
          else
            echo "未配置签名（secrets 缺失）——将产出 debug 签名的开发版"
          fi

      # NDK 是真需求：AGP 的 stripReleaseDebugSymbols 用它的 llvm-strip 剥离
      # Flutter engine .so 的调试符号（幻影目录方案实测穿帮——PITFALLS #22）。
      # :jni 编译需求已根治（path_provider_android 钉 2.2.23），CMake 不再需要。
      # 显式安装 + 上方缓存兜底（首次下载一次，之后命中）。
      # NDK 不做任何干预（回退决定，PITFALLS #23）：flutter build 全自动
      # 下载/安装它要的 NDK——接受每次下载的慢，换构建稳定不折腾。
      # CMake 是 flutter_live2d（Live2D 看板娘）native 编译的合理需求——
      # 只装这一个工具，不算 NDK 折腾。
      - name: 安装 CMake（flutter_live2d 的 native 构建需要）
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.10.2.4988404" > /dev/null

      # Shorebird 自带一份 Flutter（~/.shorebird）+ 本仓库 Flutter/NDK/SDK 缓存，
      # ubuntu runner 14GB 会满——构建前清理 runner 自带的无用工具链（~20GB）
      - name: 清理磁盘（runner 无用工具链）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          df -h /

      - name: 🐦 Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: 构建 apk（Shorebird 热更基线，分架构）
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: shorebird release android --split-per-abi
        # 版本号自动读 pubspec（version: x.y.z+build）——单一版本来源
        # 产物 = build/app/outputs/flutter-apk/app-<abi>-release.apk（热更基线）

      - name: 重命名产物（带版本号）
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi=$(echo "$f" | sed -E 's/app-(.+)-release\.apk/\1/')
            mv "$f" "my_app-v${{ needs.prepare.outputs.name }}-android-${abi}.apk"
          done

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.label }}
          path: build/app/outputs/flutter-apk/my_app-*.apk
          retention-days: 3

  # ─────────── 节点 3：Windows 构建（与 Android 并行） ───────────
  build-windows:
    if: false   # 暂时禁用 Windows 构建（恢复：删本行 + release 的 needs 加回 build-windows）
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装 Rust nightly（gpui 需要）
        uses: dtolnay/rust-toolchain@nightly

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: 构建桌宠 pet
        working-directory: rust
        run: cargo build --release

      - name: 构建 Windows 版
        run: flutter build windows --release
        # 版本号自动读 pubspec（Shorebird 不支持 Windows——普通包）

      - name: 打包 zip（exe + pet）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item build/windows/x64/runner/Release/* dist/
          Copy-Item rust/target/release/pet.exe dist/
          Compress-Archive -Path dist/* `
            -DestinationPath "my_app-v${{ needs.prepare.outputs.name }}-windows-x64.zip"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: my_app-v${{ needs.prepare.outputs.name }}-windows-x64.zip
          retention-days: 3

  # ─────────── 节点 4：编译后收尾（汇总发布） ───────────
  release:
    needs: [prepare, build-android]  # prepare 必须在列，否则拿不到版本号（build-windows 已禁用）
    runs-on: ubuntu-24.04
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Pre-release（汇总全部资产）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # 资产已在各构建节点内完成重命名（带版本号+NDK 标签）
          # name 输出已带 v 前缀，直接用（勿再拼 v——曾拼出 vv1.3.0 双 v bug）
          # 同号重发：已存在的 tag 先删后建（版本号唯一来源是 pubspec，可覆盖）
          gh release delete "${{ needs.prepare.outputs.name }}" --yes 2>/dev/null || true
          gh release create "${{ needs.prepare.outputs.name }}" \
            artifacts/*.apk artifacts/*.zip \
            --repo ${{ github.repository }} \
            --prerelease \
            --title "${{ needs.prepare.outputs.name }}" \
            --notes "开发版自动构建（commit ${GITHUB_SHA::7}）"

  # ─────────── 节点 5：失败通知（开 Issue，GitHub App 推送直达手机） ───────────
  notify:
    if: failure()
    needs: [prepare, build-android, build-windows, release]
    runs-on: ubuntu-24.04
    steps:
      - name: 开 Issue 通知构建失败
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo ${{ github.repository }} \
            --title "CD 构建失败：run #${{ github.run_number }}" \
            --body "流水线：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\ncommit: ${GITHUB_SHA::7} · 触发人：${{ github.actor }}\n点链接看日志，修复后此 issue 可关。" \
            || echo "issue 创建失败（忽略）"
