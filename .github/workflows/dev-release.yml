name: CD · 开发版发布

on:
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release

jobs:
  # ─────────── 节点 1：编译前准备（版本号计算，下游共用） ───────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.ver.outputs.name }}
      number: ${{ steps.ver.outputs.number }}
    steps:
      - uses: actions/checkout@v4

      - name: 计算 dev 版本号（v1.3.0-dev.N 自增）
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(gh api repos/${{ github.repository }}/releases \
            --jq '[.[].tag_name | select(startswith("v1.3.0-dev"))] |
                  map(split("-dev.")[1] | tonumber) |
                  (if length == 0 then 0 else max end) + 1 as $n |
                  "v1.3.0-dev.\($n)"')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "number=${NAME##*-dev.}" >> "$GITHUB_OUTPUT"
          echo "本次版本：$NAME"

  # ─────────── 节点 2：Android 构建 ───────────
  # NDK 实验结论（PITFALLS #20）：:jni 模块钉死 Flutter 默认 28.2，
  # 换 30.0（镜像预装）直接构建失败——28.2 是硬需求，显式安装+缓存兜底
  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 缓存 Android SDK 与 Gradle
        uses: actions/cache@v4
        with:
          save-always: true
          path: |
            ${{ env.ANDROID_HOME }}/build-tools
            ${{ env.ANDROID_HOME }}/platforms
            ~/.gradle/caches
            ~/.gradle/wrapper
          # 固定 key（手工 bump）：SDK 内容极少变；hash 配置文件会造成
          # "一改配置就砸缓存"的恶性循环（PITFALLS #19）
          key: ${{ runner.os }}-android-sdk-cache-v1
          restore-keys: |
            ${{ runner.os }}-android-sdk-cache-

      - name: 恢复签名配置（从三个 secret 构造 key.properties）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/my_app-release.jks
            printf 'keyAlias=%s\nkeyPassword=%s\nstoreFile=my_app-release.jks\nstorePassword=%s\n' \
              "$KEY_ALIAS" "$KEY_PASSWORD" "$KEY_PASSWORD" > android/key.properties
            echo "签名配置已恢复"
          else
            echo "未配置签名（secrets 缺失）——将产出 debug 签名的开发版"
          fi

      # :jni 模块已根治（path_provider_android 钉 2.2.23 纯 Kotlin 版）：
      # 无需 NDK/CMake，见 PITFALLS #20

      - name: 构建 apk（分架构 + 版本参数化）
        run: >
          flutter build apk --release --split-per-abi
          --build-name=${{ needs.prepare.outputs.name }}
          --build-number=${{ needs.prepare.outputs.number }}

      - name: 重命名产物（带版本号）
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi=$(echo "$f" | sed -E 's/app-(.+)-release\.apk/\1/')
            mv "$f" "my_app-v${{ needs.prepare.outputs.name }}-android-${abi}.apk"
          done

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.label }}
          path: build/app/outputs/flutter-apk/my_app-*.apk
          retention-days: 3

  # ─────────── 节点 3：Windows 构建（与 Android 并行） ───────────
  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装 Rust nightly（gpui 需要）
        uses: dtolnay/rust-toolchain@nightly

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: 构建桌宠 pet
        working-directory: rust
        run: cargo build --release

      - name: 构建 Windows 版
        run: >
          flutter build windows --release
          --build-name=${{ needs.prepare.outputs.name }}
          --build-number=${{ needs.prepare.outputs.number }}

      - name: 打包 zip（exe + pet）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item build/windows/x64/runner/Release/* dist/
          Copy-Item rust/target/release/pet.exe dist/
          Compress-Archive -Path dist/* `
            -DestinationPath "my_app-v${{ needs.prepare.outputs.name }}-windows-x64.zip"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: my_app-v${{ needs.prepare.outputs.name }}-windows-x64.zip
          retention-days: 3

  # ─────────── 节点 4：编译后收尾（汇总发布） ───────────
  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Pre-release（汇总全部资产）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # 资产已在各构建节点内完成重命名（带版本号+NDK 标签）
          gh release create "v${{ needs.prepare.outputs.name }}" \
            artifacts/*.apk artifacts/*.zip \
            --prerelease \
            --title "v${{ needs.prepare.outputs.name }}" \
            --notes "开发版自动构建（commit ${GITHUB_SHA::7}）"
