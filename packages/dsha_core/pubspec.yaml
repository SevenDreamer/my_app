name: dsha_core
description: DSHA 重构核心：安装流水线编排、备份/配置 API、兼容层（Dart 面）。
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

# 纯逻辑层；crypto = 官方 Dart 团队包（桥握手 HMAC/SHA-256）。
# Rust 系统面经 FFI（后续批次）接入。
dependencies:
  crypto: ^3.0.0
  # dart:ffi 分配器（malloc/calloc）；官方 Dart 工具包
  ffi: ^2.1.0

dev_dependencies: {}
